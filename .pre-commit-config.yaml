repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--line-length=100"]
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
# Frontend lint (eslint) is run via `npm run lint`; it is intentionally not wired
# into pre-commit here because the project's eslint version/setup differs from
# the generic hook.
